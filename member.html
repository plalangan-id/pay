<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MOBILE BILLING | PLALANGAN.NET</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Roboto:wght@700;800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0085FF;
      --gold: #FFB800;
      --success: #22C55E;
      --danger: #EF4444;
      
      /* Default Dark Mode (Kunci) */
      --bg-body: #000;
      --bg-container: #0F172A;
      --card-bg: #1E293B;
      --text-main: #F1F5F9;
      --text-muted: #94A3B8;
      --input-bg: #1E293B;
      --input-border: #334155;
      --v-box-bg: rgba(0, 0, 0, 0.3);
    }

    /* Light Mode Styles */
    [data-theme="light"] {
      --bg-body: #E2E8F0;
      --bg-container: #F8FAFC;
      --card-bg: #FFFFFF;
      --text-main: #0F172A;
      --text-muted: #64748B;
      --input-bg: #FFFFFF;
      --input-border: #CBD5E1;
      --v-box-bg: #F1F5F9;
    }

    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      background-color: var(--bg-body);
      margin: 0; padding: 0; 
      display: flex; justify-content: center;
      color: var(--text-main);
      transition: background 0.3s ease;
    }

    .mobile-container {
      width: 100%; max-width: 480px; min-height: 100vh;
      background-color: var(--bg-container);
      position: relative;
      overflow-x: hidden; padding-bottom: 40px;
    }

    /* THEME TOGGLE */
    .theme-toggle {
      position: absolute; top: 20px; right: 20px;
      background: rgba(255,255,255,0.2);
      border: none; color: white; width: 40px; height: 40px;
      border-radius: 12px; cursor: pointer; z-index: 10;
      display: flex; align-items: center; justify-content: center; font-size: 20px;
    }

    /* HEADER */
    .header {
      background: linear-gradient(180deg, #0085FF 0%, #0056FF 100%);
      padding: 40px 20px 80px;
      border-bottom-left-radius: 40px; border-bottom-right-radius: 40px;
      color: white;
    }

    .brand { font-weight: 800; font-size: 22px; text-align: center; margin-bottom: 25px; }
    .brand span { color: var(--gold); }

    /* VOUCHER CARD */
    .voucher-card {
      background: var(--card-bg);
      margin: -40px 20px 20px;
      padding: 25px;
      border-radius: 25px;
      display: flex; flex-direction: column; gap: 15px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.2);
      border: 1px solid rgba(255,184,0,0.2);
    }

    .v-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed var(--text-muted); padding-bottom: 10px; }
    .v-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); font-weight: 700; }
    
    .v-code-box {
      background: var(--v-box-bg);
      padding: 20px 15px; 
      border-radius: 20px; 
      text-align: center;
      border: 1px solid rgba(255, 184, 0, 0.3);
      display: flex; flex-direction: column; gap: 12px;
    }

    .v-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; justify-items: center; }

    .v-code { 
      font-family: 'Roboto', monospace; 
      color: var(--gold); 
      font-size: 16px; font-weight: 800; 
      background: rgba(255, 184, 0, 0.1);
      padding: 12px 5px; border-radius: 12px;
      width: 100%; border: 1px solid rgba(255, 184, 0, 0.2);
      box-sizing: border-box;
    }

    /* INFO & PAY SECTION */
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 0 20px 15px; }
    .info-item { background: var(--card-bg); padding: 15px; border-radius: 20px; border: 1px solid var(--input-border); }
    .info-val { font-size: 16px; font-weight: 800; color: var(--gold); margin-top: 5px; }

    .pay-section { margin: 0 20px 25px; background: var(--card-bg); padding: 15px; border-radius: 20px; border: 1px solid var(--input-border); }
    .pay-group { display: flex; gap: 10px; }
    .pay-input { 
      flex: 1; border: 1px solid var(--input-border); background: var(--input-bg); color: var(--text-main);
      padding: 12px; border-radius: 12px; font-family: 'JetBrains Mono'; font-weight: 700; outline: none; 
    }
    .pay-btn { background: var(--primary); color: white; border: none; padding: 0 20px; border-radius: 12px; font-weight: 800; cursor: pointer; }

    /* HISTORY WITH SCROLL */
    .report-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 0 20px 25px; }
    .report-item { padding: 12px; border-radius: 15px; color: white; }
    .bg-in { background: var(--success); }
    .bg-out { background: var(--danger); }
    
    /* MODIFIKASI SCROLL DISINI */
    .history-container { 
      margin: 0 20px; 
      max-height: 250px; /* Batas tinggi kotak riwayat */
      overflow-y: auto;  /* Aktifkan scroll vertikal */
      padding-right: 5px;
    }
    /* Mempercantik Scrollbar */
    .history-container::-webkit-scrollbar { width: 4px; }
    .history-container::-webkit-scrollbar-thumb { background: var(--input-border); border-radius: 10px; }

    .history-item { 
      background: var(--card-bg); padding: 12px 15px; border-radius: 15px; 
      display: flex; justify-content: space-between; align-items: center; 
      margin-bottom: 8px; border: 1px solid var(--input-border); 
    }

    #loader { position: fixed; inset: 0; background: var(--bg-container); opacity: 0.9; display: none; align-items: center; justify-content: center; z-index: 1000; font-weight: 800; color: var(--gold); }
  </style>
</head>
<body data-theme="dark">

<div id="loader">MEMPROSES...</div>

<div class="mobile-container">
  <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">☀️</button>

  <div id="loginArea" style="padding: 100px 30px; text-align: center;">
    <div class="brand" style="font-size: 32px; color: var(--primary);">PLALANGAN<span>.NET</span></div>
    <input type="text" id="memberId" placeholder="ID Member / No HP" style="width: 100%; padding: 18px; border-radius: 20px; border: 1px solid var(--input-border); background: var(--input-bg); color: var(--text-main); text-align: center; font-weight: 700; margin-bottom: 15px; box-sizing: border-box; outline: none;">
    <button onclick="loginMember()" style="width: 100%; padding: 18px; border-radius: 20px; border: none; background: var(--primary); color: white; font-weight: 800; cursor: pointer;">MASUK</button>
  </div>

  <div id="dashboardArea" style="display: none;">
    <div class="header">
      <div class="brand">PLALANGAN<span>.NET</span></div>
      <div style="text-align: center; font-weight: 700;">Halo, <span id="userNama">-</span></div>
    </div>

    <div class="voucher-card">
      <div class="v-header">
        <div class="v-label">WiFi Voucher Access</div>
        <div id="userStatus" style="font-size: 9px; background: var(--success); color:white; padding: 4px 8px; border-radius: 8px; font-weight: 800;">AKTIF</div>
      </div>
      <div class="v-code-box">
        <div class="v-label" style="text-align: center; margin-bottom: 5px; opacity: 0.6;">KODE VOUCHER ANDA</div>
        <div id="voucherContainer" class="v-grid"></div>
      </div>
      <div class="v-footer">
        <div><div class="v-label">Berlaku S/D</div><div id="userTempo" style="font-weight: 700; color: var(--gold);">--/--/--</div></div>
        <div style="text-align: right;"><div class="v-label">ID Member</div><div id="userIdDisplay" style="font-weight: 700;">-</div></div>
      </div>
    </div>

    <div class="info-grid">
      <div class="info-item"><div class="v-label">Sisa Saldo</div><div id="userSaldo" class="info-val">Rp 0</div></div>
      <div class="info-item"><div class="v-label">Akun/Paket</div><div class="info-val" style="color: var(--text-main);">Member</div></div>
    </div>

    <div class="v-label" style="padding: 0 25px 8px;">Bayar Tagihan</div>
    <div class="pay-section">
      <div class="pay-group">
        <input type="number" id="inputNominal" class="pay-input" placeholder="Nominal...">
        <button class="pay-btn" onclick="bayarSekarang()">BAYAR</button>
      </div>
    </div>

    <div class="report-grid">
      <div class="report-item bg-in"><div class="v-label" style="color:white; opacity:0.8;">UANG MASUK</div><div id="totalMasuk" style="font-family:'JetBrains Mono'; font-weight:800;">Rp 0</div></div>
      <div class="report-item bg-out"><div class="v-label" style="color:white; opacity:0.8;">UANG KELUAR</div><div id="totalKeluar" style="font-family:'JetBrains Mono'; font-weight:800;">Rp 0</div></div>
    </div>

    <div class="v-label" style="padding: 0 25px 8px;">Riwayat Transaksi</div>
    <div class="history-container">
      <div id="historyList"></div>
    </div>

    <div style="padding: 20px;">
      <button onclick="logout()" style="width: 100%; background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); padding: 15px; border-radius: 15px; font-weight: 800; cursor: pointer;">KELUAR AKUN</button>
    </div>
  </div>
</div>

<script>
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwcCZ8f396U37bbZumLijybhN20nDskS5Dze35Axl4tS40bMR_jF5Q8A9lTB9JIgPhVKw/exec";

  function toggleTheme() {
    const body = document.body;
    const btn = document.getElementById('themeBtn');
    const newTheme = body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    body.setAttribute('data-theme', newTheme);
    btn.innerText = newTheme === 'dark' ? '☀️' : '🌙';
    localStorage.setItem('p-theme', newTheme);
  }

  // SISIPAN: Fungsi pembaca format waktu ISO dunia ke waktu lokal Indonesia dd/MM/yyyy HH:mm
  function formatWaktuLokal(waktuMentah) {
    if (!waktuMentah) return "-";
    if (typeof waktuMentah === 'string' && waktuMentah.includes('T')) {
      try {
        const d = new Date(waktuMentah);
        if (!isNaN(d.getTime())) {
          const tgl = String(d.getDate()).padStart(2, '0');
          const bln = String(d.getMonth() + 1).padStart(2, '0');
          const thn = d.getFullYear();
          const jam = String(d.getHours()).padStart(2, '0');
          const mnt = String(d.getMinutes()).padStart(2, '0');
          return `${tgl}/${bln}/${thn} ${jam}:${mnt}`;
        }
      } catch (e) { }
    }
    return waktuMentah;
  }

  async function loginMember(isAuto = false) {
    const idInput = document.getElementById('memberId').value;
    if(!idInput) return;
    const id = idInput.toUpperCase().trim();

    document.getElementById('loader').style.display = 'flex';
    try {
      const response = await fetch(`${WEB_APP_URL}?action=GET_DATA&id=${id}`);
      const res = await response.json();
      document.getElementById('loader').style.display = 'none';

      if(res.success) {
        localStorage.setItem('p-pay-session', id);
        document.getElementById('loginArea').style.display = 'none';
        document.getElementById('dashboardArea').style.display = 'block';
        
        document.getElementById('userNama').innerText = res.data.nama;
        document.getElementById('userSaldo').innerText = "Rp " + res.data.saldo.toLocaleString('id-ID');
        document.getElementById('userIdDisplay').innerText = id;
        document.getElementById('userTempo').innerText = res.data.tempo || "--/--/--";

        const vContainer = document.getElementById('voucherContainer');
        const aktivasiData = String(res.data.aktivasi || ""); 
        if (aktivasiData.includes("#")) {
          vContainer.innerHTML = aktivasiData.split("#").map(c => `<div class="v-code">${c.trim()}</div>`).join('');
        } else {
          vContainer.innerHTML = `<div class="v-code" style="grid-column: span 2;">${aktivasiData || "BELUM AKTIF"}</div>`;
        }

        let masuk = 0, keluar = 0, logHtml = "";
        if(res.logs) {
          res.logs.forEach(l => {
            const nominal = Number(l.nominal) || 0;
            if(l.tipe === "TOPUP") masuk += nominal; else keluar += nominal;
            
            // SISIPAN: Mengubah format tanggal mentah pada riwayat transaksi member
            const tglTampil = formatWaktuLokal(l.tgl);

            logHtml += `
              <div class="history-item">
                <div><div style="font-weight:700;font-size:12px;">${l.ket}</div><div style="font-size:9px;color:var(--text-muted);">${tglTampil}</div></div>
                <div style="font-family:'JetBrains Mono';font-weight:800;font-size:12px;color:${l.tipe==='TOPUP'?'#22C55E':'#EF4444'}">
                  ${l.tipe==='TOPUP'?'+':'-'}${nominal.toLocaleString('id-ID')}
                </div>
              </div>`;
          });
        }
        document.getElementById('totalMasuk').innerText = "Rp " + masuk.toLocaleString('id-ID');
        document.getElementById('totalKeluar').innerText = "Rp " + keluar.toLocaleString('id-ID');
        document.getElementById('historyList').innerHTML = logHtml || '<div style="text-align:center; opacity:0.5; font-size:12px;">Belum ada riwayat</div>';

      } else if(!isAuto) { alert("ID Tidak Ditemukan!"); }
    } catch(e) { document.getElementById('loader').style.display = 'none'; }
  }

  async function bayarSekarang() {
    const id = localStorage.getItem('p-pay-session');
    const nominalInput = document.getElementById('inputNominal');
    const nominal = parseInt(nominalInput.value);

    if (!nominal || nominal <= 0) {
      alert("Masukkan nominal pembayaran!");
      return;
    }

    if (!confirm(`Konfirmasi pembayaran sebesar Rp ${nominal.toLocaleString('id-ID')}?`)) return;

    document.getElementById('loader').style.display = 'flex';
    try {
      const response = await fetch(`${WEB_APP_URL}?action=POTONG_SALDO&id=${id}&nominal=${nominal}`);
      const res = await response.json();
      
      document.getElementById('loader').style.display = 'none';
      if (res.success) {
        alert("Pembayaran Berhasil!");
        nominalInput.value = "";
        loginMember(true);
      } else {
        alert("Gagal: " + res.msg);
      }
    } catch (e) {
      document.getElementById('loader').style.display = 'none';
      alert("Terjadi kesalahan koneksi!");
    }
  }

  function logout() { localStorage.removeItem('p-pay-session'); location.reload(); }

  window.onload = () => {
    const savedTheme = localStorage.getItem('p-theme') || 'dark';
    document.body.setAttribute('data-theme', savedTheme);
    document.getElementById('themeBtn').innerText = savedTheme === 'dark' ? '☀️' : '🌙';

    const savedId = localStorage.getItem('p-pay-session');
    if(savedId) { 
      document.getElementById('memberId').value = savedId; 
      loginMember(true); 
    }
  };
</script>
</body>
</html>
